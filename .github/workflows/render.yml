name: Render video
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Video slug (folder name in src/videos)"
        required: true
        default: "brand-demo"
      quality:
        description: "draft or final"
        required: true
        default: "final"
      footage_url:
        description: "Optional direct download URL for the edited footage (public/videos/<slug>/cut-norm.mp4) if it isn't in the repo"
        required: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SLUG: ${{ github.event.inputs.slug }}
      QUALITY: ${{ github.event.inputs.quality }}
      FOOTAGE_URL: ${{ github.event.inputs.footage_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Fetch footage
        if: ${{ github.event.inputs.footage_url != '' }}
        run: |
          mkdir -p "public/videos/$SLUG"
          curl -L "$FOOTAGE_URL" -o "public/videos/$SLUG/cut-norm.mp4"
      - name: Face rule check (nothing over or above the face)
        run: |
          pip install --quiet opencv-python-headless numpy
          python3 scripts/check_face.py "$SLUG"
      - name: Render
        run: npm run "$QUALITY" -- "$SLUG" "out/$SLUG-$QUALITY.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.slug }}-${{ github.event.inputs.quality }}
          path: out/*.mp4
