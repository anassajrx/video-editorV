name: ve-kaggle-secrets
# One-time setup (and after changing the Google token): copies the Google credentials from the GitHub secrets into
# the PRIVATE Kaggle dataset <user>/ve-secrets, which the Kaggle prep kernel reads. Nothing is printed.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["platform/run-secrets-setup.txt"]

jobs:
  secrets:
    runs-on: ubuntu-latest
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - run: pip install -q kaggle
      - name: Write the private dataset
        run: |
          mkdir -p /tmp/ds && cd /tmp/ds
          python3 - <<'EOF'
          import json, os
          json.dump({k: os.environ[k] for k in ("GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET", "GOOGLE_REFRESH_TOKEN")},
                    open("ve-secrets.json", "w"))
          json.dump({"title": "ve-secrets", "id": f"{os.environ['KAGGLE_USERNAME']}/ve-secrets",
                     "licenses": [{"name": "CC0-1.0"}]}, open("dataset-metadata.json", "w"))
          EOF
          if kaggle datasets status "$KAGGLE_USERNAME/ve-secrets" >/dev/null 2>&1; then
            kaggle datasets version -p /tmp/ds -m "update" -q
          else
            kaggle datasets create -p /tmp/ds -q
          fi
          rm -f /tmp/ds/ve-secrets.json
          echo "Private dataset $KAGGLE_USERNAME/ve-secrets is ready."
